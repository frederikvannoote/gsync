name: CI

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Conan
        run: python -m pip install --upgrade pip conan==2.*

      - name: Cache Conan and build folder
        uses: actions/cache@v4
        with:
          path: |
            %USERPROFILE%\.conan2
            build
          key: ${{ runner.os }}-conan-${{ matrix.build_type }}-${{ hashFiles('**/conanfile.txt') }}

      - name: Create build dir
        run: mkdir -Force build

      - name: Ensure Conan profile
        run: conan profile detect

      - name: Conan install
        run: conan install .. --output-folder=. --profile:host=default -s compiler.version=193 -s compiler.runtime=dynamic -s build_type=${{ matrix.build_type }} --build=missing
        working-directory: build

      - name: List build dir
        run: dir build

      - name: Show toolchain file (diagnostic)
        run: type build\\conan_toolchain.cmake
        shell: powershell

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtnetworkauth
          cache: true

      - name: Configure CMake
        run: cmake -S .. -B . -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\\build\\conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        working-directory: build
      - name: Show CMake libsodium status
        run: |
          Write-Output "--- CMake variables ---"
          cmake -LA -N -B . | Select-String -Pattern "sodium|libsodium" | Write-Output "(no sodium related variables found)"
        shell: powershell
      - name: Build
        run: cmake --build . --config ${{ matrix.build_type }}
        working-directory: build

      - name: Run tests
        run: ctest -C ${{ matrix.build_type }} --output-on-failure
        working-directory: build


  docs:
    name: Build Doxygen docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Configure docs (CMake)
        run: cmake -S lib/src -B build_docs

      - name: Build docs
        run: cmake --build build_docs --target docs

      - name: Show generated docs
        run: ls -la build_docs/docs || true

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build_docs/docs
