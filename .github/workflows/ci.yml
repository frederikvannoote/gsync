name: CI

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Conan
        run: python -m pip install --upgrade pip conan==2.*

      - name: Cache Conan and build folder
        uses: actions/cache@v4
        with:
          path: |
            %USERPROFILE%\.conan2
            build
          key: ${{ runner.os }}-conan-${{ matrix.build_type }}-${{ hashFiles('**/conanfile.txt') }}

      - name: Create build dir
        run: mkdir build

      - name: Ensure Conan profile
        run: conan profile detect

      - name: Conan install
        run: conan install .. --output-folder=build --profile:host=default -s settings.compiler.version=193 -s settings.compiler.runtime=dynamic -s build_type=${{ matrix.build_type }} --build=missing
        working-directory: build

      - name: List build dir
        run: dir build

      - name: Show toolchain file (diagnostic)
        run: type build\\conan_toolchain.cmake
        shell: powershell

      - name: Configure CMake
        run: cmake -S .. -B . -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\\build\\conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        working-directory: build

      - name: Build
        run: cmake --build . --config ${{ matrix.build_type }}
        working-directory: build

      - name: Run tests
        run: ctest -C ${{ matrix.build_type }} --output-on-failure
        working-directory: build
